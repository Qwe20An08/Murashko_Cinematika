<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр «Cinematica» — Расписание</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo-area" aria-label="На главную страницу">
                <div class="logo-box" aria-hidden="true">К</div>
                <h1 class="site-title">КИНОТЕАТР «Cinematica»</h1>
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <a href="index.html"    class="nav-link">ГЛАВНАЯ</a>
                <a href="schedule.html" class="nav-link active" aria-current="page">РАСПИСАНИЕ</a>
                <a href="history.html"  class="nav-link">ИСТОРИЯ</a>
                <a href="contacts.html" class="nav-link">КОНТАКТЫ</a>
            </nav>
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="container main-content" id="main">
        <div class="section-title">
            <div class="orange-bar" aria-hidden="true"></div>
            <h2>РАСПИСАНИЕ ФИЛЬМОВ</h2>
        </div>

        <nav class="date-selector" aria-label="Выбор даты">
            <button class="date-btn active" id="btn-today"    aria-pressed="true">СЕГОДНЯ</button>
            <button class="date-btn"        id="btn-tomorrow" aria-pressed="false">ЗАВТРА</button>
        </nav>

        <hr class="divider">

        <div class="movie-grid" id="movie-container" role="list" aria-live="polite" aria-label="Список фильмов">
            <!-- Фильмы добавляются через JS -->
        </div>
    </main>

    <!-- Модалка: Информация о фильме -->
    <div id="infoModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <div class="modal-content">
            <button class="close-modal" id="closeInfo" aria-label="Закрыть">&times;</button>
            <h3 id="infoTitle"></h3>
            <p id="infoDesc" style="font-size:14px; color:#4a5568; margin-bottom:16px; line-height:1.7;"></p>
            <p style="font-size:13px;"><strong>Жанр:</strong> <span id="infoGenre" style="color:#ff6600; font-weight:600;"></span></p>
        </div>
    </div>

    <!-- Модалка: Покупка билета -->
    <div id="ticketModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="ticketHeading">
        <div class="modal-content">
            <button class="close-modal" id="closeTicket" aria-label="Закрыть">&times;</button>
            <h3 id="ticketHeading">ПОКУПКА БИЛЕТА</h3>
            <p id="selectedMovie" style="text-align:center; color:#ff6600; font-weight:700; margin:16px 0 24px; font-size:15px;"></p>
            <div id="orderFormWrap">
                <div class="form-group">
                    <label for="custName">ИМЯ</label>
                    <input type="text" id="custName" placeholder="Введите ваше имя" autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label for="custPhone">ТЕЛЕФОН</label>
                    <input type="tel" id="custPhone" placeholder="+375 (__)  ___-__-__" autocomplete="tel" required>
                </div>
                <button type="button" class="submit-request-btn" id="submitOrder">ОТПРАВИТЬ ЗАЯВКУ</button>
            </div>
        </div>
    </div>

    <!-- ФУТЕР -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-info">
                <h4 class="footer-heading">КОНТАКТНАЯ ИНФОРМАЦИЯ</h4>
                <div class="footer-line"></div>
                <p>г. Минск, пр. Независимости, 13</p>
                <p>Тел: +375 (17) 123-45-67</p>
                <p>Email: cinema@centralny.by</p>
            </div>
            <div class="footer-socials">
                <h4 class="footer-heading">МЫ В СОЦСЕТЯХ</h4>
                <div class="footer-line"></div>
                <div class="social-icons">
                    <a href="https://www.instagram.com/kinoteatr.official/" class="social-link" target="_blank">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" aria-hidden="true">
                            <rect x="2" y="2" width="20" height="20" rx="6"/>
                            <circle cx="12" cy="12" r="5"/>
                            <circle cx="17.5" cy="6.5" r="1.5" fill="white" stroke="none"/>
                        </svg>
                    </a>
                    <a href="https://x.com/kinoteatr_kino" class="social-link" target="_blank">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4l11.733 16H20L8.267 4z"></path>
                            <path d="M4 20l6.768-6.768m2.464-2.464L20 4"></path>
                        </svg>
                    </a>
                    <a href="https://t.me/anndrey1337" class="social-link" target="_blank">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L2 8.5L9.5 11L18 5L11 13L11.5 21L15 17.5L19 21L22 2Z"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
        <p class="copyright">© 2026 Кинотеатр «Cinematica». Студенческий проект.</p>
    </footer>

    <script src="./js/schedule.js"></script>
</body>
</html>
